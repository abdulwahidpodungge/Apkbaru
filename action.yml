name: 'Kivy App to APK'
description: 'Build Kivy Python app into Android APK'

inputs:
  python-version:
    description: 'Python version for Buildozer'
    required: false
    default: '3.11'

  work-dir:
    description: 'Directory containing buildozer.spec'
    required: false
    default: '.'

  buildozer-cmd:
    description: 'Buildozer command'
    required: false
    default: 'buildozer -v android debug'

branding:
  color: 'green'
  icon: 'play'

runs:
  using: 'composite'

  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      shell: bash
      run: |
        sdkmanager "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0"

        yes | sdkmanager --licenses || true

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          git \
          zip \
          unzip \
          wget \
          curl \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          build-essential \
          ccache \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          libsqlite3-dev \
          libbz2-dev \
          libreadline-dev \
          liblzma-dev \
          libgdbm-dev \
          libgdbm-compat-dev \
          uuid-dev

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install setuptools wheel
        python -m pip install "Cython==0.29.36"
        python -m pip install buildozer

    - name: Install app requirements
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        if [ -f requirements.txt ]; then
          python -m pip install -r requirements.txt
        fi

    - name: Check Android tools
      shell: bash
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

        find "$ANDROID_HOME" -name aidl -type f -print

        command -v adb || true
        command -v aidl || true

    - name: Build APK
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kivy-debug-apk
        path: ${{ inputs.work-dir }}/bin/*.apk
        if-no-files-found: error
