name: Kivy App to APK
description: Build Kivy Python app into Android APK

inputs:
  python-version:
    description: Python version for Buildozer
    required: false
    default: '3.11'

  work-dir:
    description: Directory containing buildozer.spec
    required: false
    default: '.'

branding:
  color: green
  icon: play

runs:
  using: composite

  steps:

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          git \
          zip \
          unzip \
          wget \
          curl \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          build-essential \
          ccache \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          libsqlite3-dev \
          libbz2-dev \
          libreadline-dev \
          liblzma-dev \
          libgdbm-dev \
          libgdbm-compat-dev \
          uuid-dev

    - name: Set up Android SDK
      shell: bash
      run: |
        set -e

        echo "ANDROID_HOME=$ANDROID_HOME"

        export ANDROID_SDK_ROOT="$ANDROID_HOME"

        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

        echo ""
        echo "Mencari sdkmanager..."

        SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
          -type f \
          -name sdkmanager \
          -perm -111 \
          2>/dev/null | head -n 1)

        if [ -z "$SDKMANAGER" ]; then
          echo "ERROR: sdkmanager tidak ditemukan!"
          find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print
          exit 1
        fi

        echo "sdkmanager ditemukan:"
        echo "$SDKMANAGER"

        SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

        echo "SDKMANAGER_DIR=$SDKMANAGER_DIR"

        echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

        export PATH="$SDKMANAGER_DIR:$PATH"

        echo ""
        echo "Versi sdkmanager:"
        sdkmanager --version

        echo ""
        echo "Install Android SDK packages..."

        sdkmanager \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

        echo ""
        echo "Menerima Android SDK licenses..."

        yes | sdkmanager --licenses || true

    - name: Check Android SDK
      shell: bash
      run: |
        set -e

        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

        echo ""
        echo "SDK Manager:"
        find "$ANDROID_HOME/cmdline-tools" \
          -type f \
          -name sdkmanager \
          -print

        echo ""
        echo "AIDL:"
        find "$ANDROID_HOME/build-tools/34.0.0" \
          -type f \
          -name aidl \
          -print

        echo ""
        echo "ADB:"
        find "$ANDROID_HOME/platform-tools" \
          -type f \
          -name adb \
          -print

        echo ""
        echo "Build Tools:"
        ls -la "$ANDROID_HOME/build-tools/34.0.0/"

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install setuptools wheel
        python -m pip install "Cython==0.29.36"
        python -m pip install buildozer

    - name: Install app requirements
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        if [ -f requirements.txt ]; then
          python -m pip install -r requirements.txt
        fi

    - name: Check Buildozer
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        python --version
        java -version
        buildozer --version

    - name: Build APK
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        set -e
        buildozer -v android debug

    - name: Find APK
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        echo "APK hasil build:"
        find bin -type f -name "*.apk" -print

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kivy-debug-apk
        path: ${{ inputs.work-dir }}/bin/*.apk
        if-no-files-found: error
