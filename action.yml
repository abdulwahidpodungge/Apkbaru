name: 'Kivy App to APK'
description: 'Build Kivy Python app into Android APK'

inputs:
  python-version:
    description: 'Python version for Buildozer'
    required: false
    default: '3.11'

  work-dir:
    description: 'Directory containing buildozer.spec'
    required: false
    default: '.'

  buildozer-cmd:
    description: 'Buildozer command'
    required: false
    default: 'buildozer android debug'

branding:
  color: 'green'
  icon: 'play'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          git \
          zip \
          unzip \
          wget \
          curl \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          build-essential \
          ccache \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          libsqlite3-dev \
          libbz2-dev \
          libreadline-dev \
          liblzma-dev \
          libgdbm-dev \
          libgdbm-compat-dev \
          uuid-dev

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel

        python -m pip install \
          "Cython==0.29.36" \
          buildozer

    - name: Install app requirements
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        if [ -f requirements.txt ]; then
          python -m pip install -r requirements.txt
        fi

    - name: Build APK
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        ${{ inputs.buildozer-cmd }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kivy-debug-apk
        path: ${{ inputs.work-dir }}/bin/*.apk
        if-no-files-found: error
